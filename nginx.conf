server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Trang báo lỗi khi gõ sai địa chỉ
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Không cho tải file ẩn (.htaccess...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Ảnh lưu lâu, CSS/JS lưu ngắn để thấy cập nhật nhanh, HTML luôn lấy bản mới
    location ~* \.(jpe?g|png|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js)$ {
        expires 1h;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml;
}
